services:

  postgres:
    image: postgres:16
    container_name: postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: airbyte
      POSTGRES_PASSWORD: airbyte
      POSTGRES_DB: weather

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data


  airbyte:
    image: airbyte/airbyte:latest
    container_name: airbyte

    depends_on:
      - postgres

    ports:
      - "8000:8000"

volumes:
  postgres_data: